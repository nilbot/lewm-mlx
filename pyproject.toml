[project]
name = "lewm-mlx"
version = "0.1.0"
description = "MLX port of Le World Model (LeWM)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mlx>=0.31.2",
    "numpy>=1.26.4",
    "einops>=0.8.2",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "torch>=2.1.0",
    "ruff>=0.4.0",
    "stable-worldmodel>=0.1.1",
    "stable-pretraining>=0.1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint.per-file-ignores]
"tests/test_comparison.py" = ["E402"]
